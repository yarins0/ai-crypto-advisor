name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # install rather than ci: the lockfile has no entries for esbuild's platform
      # packages, which npm 11 rejects and the Windows machine this is developed on
      # cannot record.
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries
      - run: npm test
