services:
  - type: web
    name: aca-api
    runtime: node
    plan: free
    # Pinned to match the Atlas cluster's region. A cross-region cluster adds a
    # round trip to every request, and neither side's region can be changed after
    # creation without recreating the resource.
    region: frankfurt

    # Built from the repo root rather than with rootDir: apps/api, because the API
    # resolves @aca/shared through the workspace symlink that only a root install
    # creates. npm ci also runs the shared package's prepare script, so its dist/
    # exists before tsc needs its types.
    #
    # --include=dev is load-bearing: NODE_ENV below is set during the build too, and
    # npm reads it as --omit=dev, which would drop the typescript this compiles with
    # and fall through to whatever tsc the build image happens to carry.
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api

    # Renders' health checks hit this before routing traffic, so a boot that fails
    # env validation is reported as a failed deploy instead of a live 500.
    healthCheckPath: /api/health

    envVars:
      # engines.node is a range, which Render does not resolve; the major must be
      # named explicitly or it falls back to its own default.
      - key: NODE_VERSION
        value: '22'

      - key: NODE_ENV
        value: production

      # Generated by Render rather than supplied: a secret that is never typed,
      # pasted or stored outside the platform cannot leak through shell history or
      # a chat log. Values are generated once and survive redeploys.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true

      # Entered in the dashboard. The Atlas password must not enter git, and the
      # Vercel URL is not known until that project exists.
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: HF_TOKEN
        sync: false
